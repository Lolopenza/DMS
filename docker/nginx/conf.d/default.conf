server {
    listen 80;
    server_name localhost;

    # ── Frontend (SPA) ────────────────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # ── Java Backend (Spring Boot) ─────────────────────────────────────────────
    # Requests like /api/java/v1/users will be proxied to http://backend:8080/api/v1/users
    location /api/java/ {
        rewrite ^/api/java/(.*) /api/$1 break;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Python Backend (FastAPI) ───────────────────────────────────────────────
    # Requests like /api/python/v1/status will be proxied to http://math-engine:8081/api/v1/status
    location /api/python/ {
        rewrite ^/api/python/(.*) /api/$1 break;
        proxy_pass         http://math-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
